<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Result System</h1>
        <form id="studentForm" novalidate>
            <div class="form-group">
                <label for="name">Student Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="roll">Roll Number:</label>
                <input type="text" id="roll" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="htmlMarks">HTML Marks (0-100):</label>
                <input type="number" id="htmlMarks" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="cssMarks">CSS Marks (0-100):</label>
                <input type="number" id="cssMarks" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="jsMarks">JavaScript Marks (0-100):</label>
                <input type="number" id="jsMarks" min="0" max="100" required>
            </div>
            <button type="submit">Submit Result</button>
            <div id="errorMsg" class="error"></div>
        </form>

        <div id="result" class="hidden">
            <h2>Result Summary</h2>
            <p><strong>Name:</strong> <span id="resName"></span></p>
            <p><strong>Roll No:</strong> <span id="resRoll"></span></p>
            <p><strong>Total Marks:</strong> <span id="resTotal"></span></p>
            <p><strong>Percentage:</strong> <span id="resPercentage"></span>%</p>
            <p><strong>Status:</strong> <span id="resStatus"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
